<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Academic homepage — research, publications, and experience.">
  <meta property="og:title" content="Academic Homepage">
  <meta property="og:description" content="Research interests, publications, education, and contact.">
  <meta property="og:type" content="website">
  <title>Academic Homepage</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/refinements.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Main navigation">
      <a href="#hero" class="nav-brand" id="nav-brand">Home</a>
      <ul class="nav-links" id="nav-links"></ul>
      <div class="page-tools">
        <button id="search-toggle" type="button" aria-label="Search">⌕ <span data-search-label>Search</span></button>
        <button id="theme-toggle" type="button" aria-label="Switch theme">◐</button>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" class="lang-btn active" data-lang="en" aria-pressed="true">EN</button>
        <span class="lang-divider">|</span>
        <button type="button" class="lang-btn" data-lang="zh" aria-pressed="false">中文</button>
      </div>
    </nav>
  </header>

  <main>
    <div class="page-layout">
      <div class="intro-grid">
        <section id="hero" class="section hero"></section>
        <section id="about" class="section"></section>
      </div>
      <div class="main-content">
        <section id="news" class="section section-optional"></section>
        <section id="publications" class="section"></section>
        <div class="experience-grid">
        <section id="education" class="section"></section>
        <section id="experience" class="section section-optional"></section>
        </div>
        <section id="projects" class="section section-optional"></section>
        <section id="awards" class="section section-optional"></section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p id="footer-text"></p>
  </footer>

  <script src="js/link-icons.js"></script>
  <script src="js/people.js"></script>
  <script src="js/content.js"></script>
  <script src="js/site-updated.js"></script>
  <script src="js/pub-citations.js"></script>
  <script src="js/visibility.js"></script>
  <script src="js/page-ui.js"></script>
  <script src="js/main.js"></script>
  <script src="js/fun.js"></script>
</body>
</html>
